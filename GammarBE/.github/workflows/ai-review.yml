name: AI Code Review (Custom API)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history so HEAD~1 usually exists

      - name: Get diff
        id: get_diff
        run: |
          # Robust way to get diff even if it's the first commit
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Calculating diff against HEAD~1"
            git diff HEAD~1 > diff.txt
          else
            echo "First commit detected, calculating diff against empty tree"
            # Get the hash of the first commit
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            git diff-tree --no-commit-id --patch -r $FIRST_COMMIT > diff.txt
          fi
          
          # Check if diff is empty
          if [ ! -s diff.txt ]; then
            echo "Diff is empty"
            echo "DIFF_CONTENT=No changes detected." >> $GITHUB_ENV
          else
            # Limit diff size to avoid hitting API limits
            echo "DIFF_CONTENT<<EOF" >> $GITHUB_ENV
            head -c 5000 diff.txt >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Call AI API
        if: env.DIFF_CONTENT != 'No changes detected.'
        env:
          AI_KEY: ${{ secrets.CUSTOM_AI_API_KEY }}
        run: |
          python3 -c "
          import os, requests, json
          
          diff = os.environ.get('DIFF_CONTENT', '')
          api_key = os.environ.get('AI_KEY', '')
          
          if not api_key:
              print('Error: CUSTOM_AI_API_KEY is not set in GitHub Secrets')
              exit(1)
          
          url = 'https://rz3unjl.9router.com/v1/chat/completions'
          headers = {
              'api-key': api_key,
              'Content-Type': 'application/json'
          }
          payload = {
              'model': 'cx/gpt-5.3-codex',
              'messages': [
                  {
                      'role': 'user',
                      'content': f'Review this code diff and return ONLY a valid JSON array of objects with fields: file, issue, severity (low|medium|high), suggestion. Diff:\n{diff}'
                  }
              ]
          }
          
          try:
              response = requests.post(url, headers=headers, json=payload)
              response.raise_for_status()
              with open('result.json', 'w') as f:
                  f.write(response.text)
          except Exception as e:
              print(f'Error calling API: {e}')
              if 'response' in locals():
                  print(f'Response: {response.text}')
              exit(1)
          "

      - name: Debug response
        if: always()
        run: |
          if [ -f result.json ]; then
            echo "=== RAW RESPONSE ==="
            cat result.json
          else
            echo "result.json not found"
          fi

      - name: Parse AI result
        if: success()
        run: |
          if jq empty result.json > /dev/null 2>&1; then
            # Extract content which might be inside a JSON string
            CONTENT=$(jq -r '.choices[0].message.content' result.json)
            echo "$CONTENT" > review.txt
            echo "=== AI REVIEW ==="
            cat review.txt
          else
            echo "❌ Invalid JSON response from API"
            exit 1
          fi

      - name: Evaluate result
        if: success()
        run: |
          if grep -i '"severity": *"high"' review.txt; then
            echo "❌ High severity issue found. Failing pipeline."
            exit 1
          else
            echo "✅ No high severity issues."
          fi
