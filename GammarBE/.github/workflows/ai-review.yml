name: AI Code Review (Custom API)

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Lấy diff
      - name: Get diff
        run: |
          git fetch origin main
          git diff origin/main > diff.txt

      # 3. Chuẩn bị diff (tránh lỗi JSON)
      - name: Prepare diff
        run: |
          DIFF=$(cat diff.txt | head -c 4000 | jq -Rs .)
          echo "DIFF=$DIFF" >> $GITHUB_ENV

      # 4. Gọi API custom
      - name: Call AI API
        run: |
          RESPONSE=$(curl -s https://rz3unjl.9router.com/v1/chat/completions \
          -H "api-key: ${{ secrets.CUSTOM_AI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\": \"cx/gpt-5.3-codex\",
            \"messages\": [
              {
                \"role\": \"user\",
                \"content\": \"Review this code diff and return ONLY valid JSON array with fields: file, issue, severity (low|medium|high), suggestion:\n\" + $DIFF
              }
            ]
          }")

          echo "$RESPONSE" > result.json

      # 5. Debug raw response
      - name: Debug response
        run: |
          echo "=== RAW RESPONSE ==="
          cat result.json

      # 6. Parse kết quả AI
      - name: Parse AI result
        run: |
          cat result.json | jq -r '.choices[0].message.content' > review.txt
          echo "=== AI REVIEW ==="
          cat review.txt

      # 7. Đánh giá kết quả
      - name: Evaluate result
        run: |
          if grep -i '"severity": *"high"' review.txt; then
            echo "❌ High severity issue found. Failing pipeline."
            exit 1
          else
            echo "✅ No high severity issues."
          fi

      # 8. Comment vào PR
      - name: Comment PR
        run: |
          BODY=$(jq -Rs . < review.txt)

          curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"body\": \"## 🤖 AI Review\n\n\" + $BODY
          }" \
          https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments