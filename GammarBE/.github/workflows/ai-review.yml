name: AI Code Review (Custom API)

on:
  push:
    branches:
      - main
      - develop
      - test-ai   # thêm branch bạn đang test

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Lấy diff (so với commit trước)
      - name: Get diff
        run: |
          git diff HEAD~1 > diff.txt

      # 3. Chuẩn bị diff
      - name: Prepare diff
        run: |
          DIFF=$(cat diff.txt | head -c 4000 | jq -Rs .)
          echo "DIFF=$DIFF" >> $GITHUB_ENV

      # 4. Gọi API custom
      - name: Call AI API
        run: |
          RESPONSE=$(curl -s https://rz3unjl.9router.com/v1/chat/completions \
          -H "api-key: ${{ secrets.CUSTOM_AI_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\": \"cx/gpt-5.3-codex\",
            \"messages\": [
              {
                \"role\": \"user\",
                \"content\": \"Review this code diff and return ONLY valid JSON array with fields: file, issue, severity (low|medium|high), suggestion:\n\" + $DIFF
              }
            ]
          }")

          echo "$RESPONSE" > result.json

      # 5. Debug response
      - name: Debug response
        run: |
          echo "=== RAW RESPONSE ==="
          cat result.json

      # 6. Parse kết quả
      - name: Parse AI result
        run: |
          cat result.json | jq -r '.choices[0].message.content' > review.txt
          echo "=== AI REVIEW ==="
          cat review.txt

      # 7. Evaluate
      - name: Evaluate result
        run: |
          if grep -i '"severity": *"high"' review.txt; then
            echo "❌ High severity issue found. Failing pipeline."
            exit 1
          else
            echo "✅ No high severity issues."
          fi