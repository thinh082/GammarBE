name: AI Code Review (Custom API)

on:
  push:
    branches: ["**"] # Chạy trên tất cả các branch để test
  pull_request:
    branches: ["**"]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trong tab Actions

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 2 # Quan trọng để lấy được diff với HEAD~1

      - name: Get diff
        id: get_diff
        run: |
          # Kiểm tra xem có commit trước đó không
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git diff HEAD~1 > diff.txt
          else
            echo "No previous commit found, diffing against empty tree"
            git diff-tree --no-commit-id --patch -r HEAD > diff.txt
          fi
          echo "DIFF_CONTENT<<EOF" >> $GITHUB_ENV
          head -c 4000 diff.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Call AI API
        env:
          AI_KEY: ${{ secrets.CUSTOM_AI_API_KEY }}
        run: |
          # Dùng python hoặc script để build JSON an toàn hơn curl -d trực tiếp
          python3 -c "
          import os, requests, json
          
          diff = os.environ.get('DIFF_CONTENT', '')
          api_key = os.environ.get('AI_KEY', '')
          
          url = 'https://rz3unjl.9router.com/v1/chat/completions'
          headers = {
              'api-key': api_key,
              'Content-Type': 'application/json'
          }
          payload = {
              'model': 'cx/gpt-5.3-codex',
              'messages': [
                  {
                      'role': 'user',
                      'content': f'Review this code diff and return ONLY a valid JSON array of objects with fields: file, issue, severity (low|medium|high), suggestion. Diff:\n{diff}'
                  }
              ]
          }
          
          try:
              response = requests.post(url, headers=headers, json=payload)
              with open('result.json', 'w') as f:
                  f.write(response.text)
          except Exception as e:
              print(f'Error: {e}')
          "

      - name: Debug response
        run: |
          echo "=== RAW RESPONSE ==="
          cat result.json

      - name: Parse AI result
        run: |
          # Đảm bảo kết quả là JSON hợp lệ trước khi parse
          if jq empty result.json > /dev/null 2>&1; then
            jq -r '.choices[0].message.content' result.json > review.txt
            echo "=== AI REVIEW ==="
            cat review.txt
          else
            echo "❌ Invalid JSON response from API"
            exit 1
          fi

      - name: Evaluate result
        run: |
          if grep -i '"severity": *"high"' review.txt; then
            echo "❌ High severity issue found. Failing pipeline."
            exit 1
          else
            echo "✅ No high severity issues."
          fi